name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Angular build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,css}"
      - name: Production build
        run: npx ng build
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high --omit=dev
